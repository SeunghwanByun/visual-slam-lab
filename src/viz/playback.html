<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KITTI VO Playback</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101315;color:#e5e9eb;font:14px system-ui;letter-spacing:0}header{padding:16px 24px;border-bottom:1px solid #343b40;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:20px;margin:0}main{padding:16px 24px;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:24px}h2{font-size:14px;font-weight:500;margin:0 0 8px;color:#b6c1c6}.view{margin-bottom:18px}canvas{display:block;width:100%;background:#090b0c}#trajectory{aspect-ratio:1}footer{padding:16px 24px;border-top:1px solid #343b40}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select,input[type=number]{background:#262d31;color:#fff;border:1px solid #58636b;border-radius:4px;padding:8px;font:inherit}button{cursor:pointer;min-width:44px}button:disabled{opacity:.4}input[type=range]{flex:1;min-width:130px;accent-color:#30bfa5}input[type=number]{width:85px}label{display:inline-flex;gap:7px;align-items:center}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.dot{display:inline-block;width:9px;height:9px;margin-right:5px;background:var(--c)}#status{line-height:1.7;overflow-wrap:anywhere;color:#b6c1c6;margin-top:14px}.note{color:#aab7bd;font-size:12px;line-height:1.6}#metrics{font-variant-numeric:tabular-nums;margin-left:auto}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}header,footer{padding:12px}#trajectory{max-height:430px}#metrics{margin-left:0}}
</style>
<header><h1>KITTI / VO Playback</h1><span id="sequence"></span><span id="metrics"></span></header>
<main><section>
<div class="view"><h2>RAW · LEFT CAMERA</h2><canvas id="raw"></canvas></div>
<div class="view"><h2>ORB · 2D FEATURES & MATCHES</h2><canvas id="features"></canvas></div>
<div class="controls"><label><input id="points" type="checkbox" checked>특징점</label><label><input id="tracks" type="checkbox" checked>프레임 간 이동</label><label><input id="outliers" type="checkbox">제외된 매칭</label></div>
<div class="legend"><span><i class="dot" style="--c:#f3d76b"></i>ORB</span><span><i class="dot" style="--c:#30bfa5"></i>Pose inlier</span><span><i class="dot" style="--c:#f17787"></i>Rejected match</span></div>
</section><section><h2>TRAJECTORY · X / Z</h2><canvas id="trajectory" width="700" height="700"></canvas>
<div class="legend"><span><i class="dot" style="--c:#30bfa5"></i>VO estimated</span><span><i class="dot" style="--c:#f3d76b"></i>Ground truth</span></div>
<p class="note">VO: 프레임별 단위 이동 거리 · GT: 미터. 스케일 정렬 없음.<br>특징점은 2D 영상 좌표이며 3D 지도는 아직 생성하지 않습니다.</p><div id="status"></div></section></main>
<footer><div class="controls"><button id="previous" title="이전 프레임" aria-label="이전 프레임">◀</button><button id="play">재생</button><button id="next" title="다음 프레임" aria-label="다음 프레임">▶</button><input id="seek" type="range" min="0" value="0" aria-label="프레임 탐색"><input id="frame" type="number" min="0" value="0" aria-label="프레임 번호"><select id="speed" aria-label="재생 속도"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div></footer>
<script>
const data=__PLAYBACK_DATA__;
const $=id=>document.getElementById(id), frames=data.frames;
let index=0,playing=false,timer=null,generation=0;
for(const id of ['raw','features']){$(id).width=data.width;$(id).height=data.height;}
$('sequence').textContent=`SEQUENCE ${data.sequence} · ${frames.length} FRAMES`;
$('seek').max=$('frame').max=frames.length-1;
const positions=frames.flatMap(f=>f.gt?[f.vo,f.gt]:[f.vo]);
const xs=positions.map(p=>p[0]),zs=positions.map(p=>p[2]);
const minX=Math.min(...xs),maxX=Math.max(...xs),minZ=Math.min(...zs),maxZ=Math.max(...zs);
const span=Math.max(maxX-minX,maxZ-minZ,1)*1.15,cx=(minX+maxX)/2,cz=(minZ+maxZ)/2;
function trajectory(){const c=$('trajectory').getContext('2d'),w=700;
c.clearRect(0,0,w,w);const project=p=>[350+(p[0]-cx)*600/span,350-(p[2]-cz)*600/span];
c.font='13px system-ui';c.lineWidth=1;c.strokeStyle='#2c3439';c.fillStyle='#9aa9b1';
for(let i=0;i<=4;i++){let v=50+i*150;c.beginPath();c.moveTo(v,50);c.lineTo(v,650);c.moveTo(50,v);c.lineTo(650,v);c.stroke();c.fillText((cx-span/2+i*span/4).toFixed(1),v-15,677);c.fillText((cz+span/2-i*span/4).toFixed(1),3,v);}
c.fillText('X',680,677);c.fillText('Z',8,25);
for(const [key,color] of [['gt','#f3d76b'],['vo','#30bfa5']]){c.strokeStyle=color;c.lineWidth=2;c.beginPath();let started=false;for(let j=0;j<=index;j++){if(!frames[j][key]){started=false;continue;}const p=project(frames[j][key]);if(!started)c.moveTo(...p);else c.lineTo(...p);started=true;}c.stroke();if(frames[index][key]){c.fillStyle=color;c.beginPath();c.arc(...project(frames[index][key]),5,0,Math.PI*2);c.fill();}}
}
async function render(){const version=++generation,f=frames[index],img=new Image();img.src='data:image/jpeg;base64,'+f.image;await img.decode();if(version!==generation)return;
for(const id of ['raw','features'])$(id).getContext('2d').drawImage(img,0,0);
const c=$('features').getContext('2d');c.lineWidth=1;
if($('points').checked){c.fillStyle='#f3d76b';for(const [x,y] of f.points)c.fillRect(x-1,y-1,2,2);}
if($('tracks').checked)for(const [x,y,u,v,ok] of f.tracks){if(!ok&&!$('outliers').checked)continue;c.strokeStyle=ok?'#30bfa5':'#f17787';c.beginPath();c.moveTo(x,y);c.lineTo(u,v);c.stroke();c.fillStyle=c.strokeStyle;c.fillRect(u-1,v-1,3,3);}
$('seek').value=$('frame').value=index;$('metrics').textContent=`FRAME ${String(index).padStart(6,'0')} / ${frames.length-1} · ${f.time.toFixed(3)} s`;
$('status').textContent=`ORB ${f.points.length} · Matches ${f.tracks.length} · Inliers ${f.inliers} | ${f.status}`;
$('previous').disabled=index===0;$('next').disabled=index===frames.length-1;trajectory();}
function pause(){playing=false;clearTimeout(timer);$('play').textContent='재생';}
function schedule(){if(!playing)return;if(index>=frames.length-1){pause();return;}timer=setTimeout(async()=>{index++;await render();schedule();},Math.max(1,(frames[index+1].time-frames[index].time)*1000/Number($('speed').value)));}
function seek(n){pause();index=Math.max(0,Math.min(frames.length-1,Math.floor(Number(n)||0)));render();}
$('play').onclick=()=>{if(playing){pause();return;}if(index===frames.length-1)index=0;playing=true;$('play').textContent='일시정지';render();schedule();};
$('previous').onclick=()=>seek(index-1);$('next').onclick=()=>seek(index+1);$('seek').oninput=e=>seek(e.target.value);$('frame').onchange=e=>seek(e.target.value);
for(const id of ['points','tracks','outliers'])$(id).onchange=render;
$('speed').onchange=()=>{clearTimeout(timer);schedule();};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click();}if(e.code==='ArrowRight')seek(index+1);if(e.code==='ArrowLeft')seek(index-1);});
render();
</script></html>
