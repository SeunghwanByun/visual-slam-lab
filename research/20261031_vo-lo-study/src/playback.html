<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITTI VO / LO comparison</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101719;color:#e2e8e7;font:14px system-ui;letter-spacing:0}header,footer{padding:16px;border-bottom:1px solid #435255}h1{font-size:20px;margin:0 0 10px}main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;padding:16px}h2{font-size:14px;font-weight:500}canvas{width:100%;display:block;background:#080c0e}#bev,#path{aspect-ratio:1}#bev{max-width:550px}footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input[type=range]{flex:1;min-width:120px}button,select{padding:8px 12px;background:#283437;color:white;border:1px solid #667b80;border-radius:4px}label{margin-right:12px}small{display:block;line-height:1.6;color:#b9c5c5}#info{font-variant-numeric:tabular-nums}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<header><h1>KITTI 00 · VO / LO 비교</h1><span id="info"></span><p><a style="color:#61dac4" href="../../../20261031_loop-readiness/artifacts/loops/index.html">전체 시퀀스 재방문 후보</a></p></header>
<main><section><h2>카메라 / LiDAR 투영</h2><canvas id="camera"></canvas><p><label><input id="orb" type="checkbox">ORB 대응점</label><label><input id="projection" type="checkbox" checked>LiDAR 투영</label></p><h2>현재 LiDAR 스캔 · 센서 좌표계 · 전방 위쪽</h2><canvas id="bev" width="600" height="600"></canvas></section><section><h2>궤적 · 첫 카메라 좌표계</h2><select id="mode"><option value="shape">전역 Sim(3) 정렬 비교</option><option value="metric">GT / LO 미터 비교</option></select><p><small>검정 대신 흰색: GT · 노랑: VO · 청록: LO<br>Sim(3)는 전체 구간 GT로 사후 정렬한 진단입니다. VO 실제 거리 추정이 아닙니다.</small></p><canvas id="path" width="650" height="650"></canvas></section></main>
<footer><button id="prev" aria-label="이전 프레임">◀</button><button id="play">재생</button><button id="next" aria-label="다음 프레임">▶</button><input id="seek" type="range" min="0" value="0" aria-label="프레임 탐색"><select id="speed" aria-label="속도"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></footer>
<script>const data=__DATA__;const $=id=>document.getElementById(id);let index=0,playing=false,timer,version=0;$('seek').max=data.frames.length-1;$('camera').width=data.width;$('camera').height=data.height;
async function render(){const token=++version,f=data.frames[index],img=new Image();img.src='data:image/jpeg;base64,'+f.image;await img.decode();if(token!==version)return;const c=$('camera').getContext('2d');c.drawImage(img,0,0);if($('orb').checked){c.fillStyle='#f6d55a';for(const [x,y]of f.features)c.fillRect(x,y,2,2);}if($('projection').checked){c.fillStyle='#1dffbf';for(const [x,y]of f.projection)c.fillRect(x,y,2,2);}
const b=$('bev').getContext('2d');b.clearRect(0,0,600,600);b.strokeStyle='#37454a';for(let v=50;v<600;v+=50){b.beginPath();b.moveTo(v,0);b.lineTo(v,600);b.moveTo(0,v);b.lineTo(600,v);b.stroke();}for(const [x,y,z]of f.lidar){b.fillStyle=z>-1?'#4bd5bd':'#8d9b9e';b.fillRect(300-y*5,500-x*5,2,2);}b.fillStyle='white';b.fillText('10 m / grid; x forward, y left',10,20);
const p=$('path').getContext('2d');p.clearRect(0,0,650,650);let names=$('mode').value==='shape'?['gt','baseline_sim3','lo_sim3']:['gt','lo_metric'];let all=names.flatMap(n=>data.poses[n]);let xs=all.map(v=>v[0]),zs=all.map(v=>v[2]);let xmin=Math.min(...xs),xmax=Math.max(...xs),zmin=Math.min(...zs),zmax=Math.max(...zs),span=Math.max(xmax-xmin,zmax-zmin,1)*1.1;let cx=(xmin+xmax)/2,cz=(zmin+zmax)/2;for(const name of names){p.strokeStyle=name==='gt'?'#ffffff':name.startsWith('baseline')?'#f6d55a':'#30c8ac';p.lineWidth=2;p.beginPath();for(let i=0;i<=index;i++){const v=data.poses[name][i],x=325+(v[0]-cx)*570/span,y=325-(v[2]-cz)*570/span;if(i===0)p.moveTo(x,y);else p.lineTo(x,y);}p.stroke();}p.fillStyle='white';p.fillText('X right / Z forward (m after stated alignment)',15,635);$('info').textContent=`FRAME ${index} / ${data.frames.length-1} · ${f.time.toFixed(3)} s`;$('seek').value=index;$('prev').disabled=index===0;$('next').disabled=index===data.frames.length-1;}
function pause(){playing=false;clearTimeout(timer);$('play').textContent='재생';}function schedule(){if(!playing)return;if(index===data.frames.length-1){pause();return;}timer=setTimeout(async()=>{index++;await render();schedule();},1000*(data.frames[index+1].time-data.frames[index].time)/Number($('speed').value));}function seek(i){pause();index=Math.max(0,Math.min(data.frames.length-1,i));render();}$('play').onclick=()=>{if(playing){pause();return;}if(index===data.frames.length-1)index=0;playing=true;$('play').textContent='일시정지';render();schedule();};$('prev').onclick=()=>seek(index-1);$('next').onclick=()=>seek(index+1);$('seek').oninput=e=>seek(Number(e.target.value));for(const id of ['orb','projection','mode'])$(id).onchange=render;$('speed').onchange=()=>{clearTimeout(timer);schedule();};render();</script></html>
