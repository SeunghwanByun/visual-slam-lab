<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITTI 재방문 후보</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#222;background:#f5f7f8;letter-spacing:0}header{padding:18px 24px;border-bottom:1px solid #bbb}h1{font-size:22px;margin:0 0 8px}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;padding:20px}img{display:block;width:100%;height:auto}select{padding:8px;margin-bottom:12px;max-width:100%}p{line-height:1.6}h2{font-size:16px}a{color:#086b79}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}</style>
<header><h1>KITTI 00 · 재방문 후보</h1><a href="../../../20261031_vo-lo-study/artifacts/playback/index.html">VO / LO 비교 재생</a><p>GT 위치로 선정한 참고 후보입니다. 자동 loop detection 또는 loop closure 최적화 결과가 아닙니다.</p></header>
<main><section><h2>전체 GT 궤적 · 4,541프레임</h2><img id="path" alt="KITTI 전체 경로와 후보 위치"></section><section><select id="pair" aria-label="재방문 후보 선택"></select><p id="stats"></p><h2 id="firstTitle"></h2><img id="first" alt="먼저 방문한 시점의 영상"><h2 id="secondTitle"></h2><img id="second" alt="다시 방문한 시점의 영상"></section></main>
<script>const data=__DATA__;const $=id=>document.getElementById(id);$('path').src='data:image/png;base64,'+data.path_image;for(let i=0;i<data.pairs.length;i++){const p=data.pairs[i],o=document.createElement('option');o.value=i;o.textContent=`후보 ${i+1}: ${p.first} → ${p.second}`;$('pair').appendChild(o);}function render(){const p=data.pairs[Number($('pair').value)];$('stats').textContent=`GT 위치 차이 ${p.distance_m.toFixed(3)}m · ${p.elapsed_s.toFixed(1)}초 간격 · 중간 이동 ${p.travel_m.toFixed(1)}m · 상대 회전 ${p.view_angle_deg.toFixed(2)}°`;$('firstTitle').textContent=`Frame ${p.first}`;$('secondTitle').textContent=`Frame ${p.second}`;$('first').src='data:image/jpeg;base64,'+p.images[0];$('second').src='data:image/jpeg;base64,'+p.images[1];}$('pair').onchange=render;render();</script></html>
